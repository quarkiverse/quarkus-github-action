name: 'My action name'
description: 'My action description'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  action:
    description: 'Name of the action (if named)'
    required: false

runs:
  using: "composite"
  steps:
    - name: Inject quarkus-github-action repository credentials
      shell: bash
      run: |
        if [ -f ~/.m2/settings.xml ]; then
          if ! grep -q '<id>quarkus-github-action</id>' ~/.m2/settings.xml; then
            yq -p xml -o xml -i '.settings.servers.server |= (. | [.] + [{"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}])' ~/.m2/settings.xml
          fi
        else
          mkdir -p ~/.m2/
          yq -p xml -o xml -n '.settings.servers.server = {"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}' > ~/.m2/settings.xml
        fi
    - name: Set up Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'
        set-default: false
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - name: Run the action
      id: action
      run: |
        if [[ -n "${JAVA_HOME_17_X64}" ]]; then
          echo "Installing ${JAVA_HOME_17_X64} as JDK 17 for JBang"
          jbang --verbose jdk install java-17 ${JAVA_HOME_17_X64}
        fi
        jbang --java 17 --fresh --repos 'quarkus-github-action=https://maven.pkg.github.com/your-org/your-repository/' --repos 'mavencentral' org.test:test-codestart:1.0.0-codestart
      shell: bash
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
